---
name: test-jobs

# Runs the Data Manager Job Tester ("jote") against every job-based submodule.
#
# For each job repository we run 'jote --dry-run' (which does not execute any
# tests) against every manifest found in its 'data-manager' directory. A
# dry-run validates the Job Definition and Manifest files against the decoder
# schemas and lint rules without needing Docker or any running containers.
#
# jote is installed from PyPI (https://pypi.org/project/im-jote/) at the version
# pinned by JOTE_VERSION below. Pinning jote alone is NOT enough to make the
# check reproducible: the schemas live in the *decoder*, and jote depends on it
# with an open range ('im-data-manager-job-decoder>=2.7.0'). A decoder release
# therefore changes validation for everybody, immediately, and lands as a
# failure on whatever unrelated pull request happens to run next.
#
# That is not hypothetical - decoder 2.7.0 (2026-08-13) tightened
# 'annotation-properties' and broke two unrelated documentation merges. So we
# pin the decoder too, and bump it deliberately.
#
# The scheduled run is the exception: it installs the decoder *unpinned* as a
# canary, so a release that changes validation is still caught within a week,
# on a run nobody is waiting on, rather than by ambushing a contributor.

env:
  # The version of the im-jote package (https://pypi.org/project/im-jote/) to
  # install and run. Change this in one place to move every matrix leg.
  JOTE_VERSION: '0.14.0'
  # The version of im-data-manager-job-decoder
  # (https://pypi.org/project/im-data-manager-job-decoder/) that carries the
  # Job Definition and Manifest schemas jote validates against. Pinned so a
  # decoder release cannot change the meaning of a green build. Bump this
  # deliberately, and expect to fix Job Definitions when you do.
  DECODER_VERSION: '2.7.0'

on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  # Weekly (Monday 06:24 UTC) so a new jote/schema release that changes
  # validation is caught even without a repository change.
  - cron: '24 6 * * 1'
  workflow_dispatch:

jobs:
  jote:
    runs-on: ubuntu-latest
    strategy:
      # Test every repository even if one fails, so a single non-compliant
      # repository does not hide the status of the others.
      fail-fast: false
      matrix:
        repo:
        - virtual-screening
        - squonk2-cdk
        - squonk2-chemaxon
        - squonk2-fragmenstein
        - squonk2-jaqpot
        - squonk2-smartcyp
        - squonk2-desc-mordred
        - squonk2-desc-rdkit
        - squonk2-train-test-split
        - squonk2-skl
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Checkout the ${{ matrix.repo }} submodule
      run: |
        # The submodules are declared with SSH URLs; rewrite to anonymous
        # HTTPS so the (public) job repository can be fetched without a key.
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init -- "${{ matrix.repo }}"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install jote
      # On the scheduled run the decoder is left unpinned, so a new release is
      # caught as a canary. Everywhere else it is pinned, so an unrelated pull
      # request cannot be failed by someone else's release.
      run: |
        python -m pip install --upgrade pip
        if [ "${{ github.event_name }}" = "schedule" ]; then
          echo "Scheduled canary run: installing the latest decoder"
          pip install "im-jote==${JOTE_VERSION}"
        else
          pip install "im-jote==${JOTE_VERSION}" \
                      "im-data-manager-job-decoder==${DECODER_VERSION}"
        fi
        echo "jote    $(pip show im-jote | awk '/^Version:/{print $2}')"
        echo "decoder $(pip show im-data-manager-job-decoder | awk '/^Version:/{print $2}')"

    - name: Dry-run jote against every manifest
      working-directory: ${{ matrix.repo }}
      run: |
        shopt -s nullglob
        manifests=(data-manager/manifest*.yaml data-manager/manifest*.yml)
        if [ ${#manifests[@]} -eq 0 ]; then
          echo "No manifests found in ${{ matrix.repo }}/data-manager"
          exit 1
        fi
        rc=0
        for manifest in "${manifests[@]}"; do
          name="$(basename "${manifest}")"
          echo "::group::jote --manifest ${name} --dry-run"
          # --allow-no-tests keeps this a pure definition/schema check: a
          # manifest whose jobs have no tests must not fail the dry-run.
          jote --manifest "${name}" --dry-run --allow-no-tests || rc=1
          echo "::endgroup::"
        done
        exit ${rc}
